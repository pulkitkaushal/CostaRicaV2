<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDF2EA">
<meta name="description" content="Trip companion for La Fortuna, Costa Rica — Aug 26–29, 2026.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>La Fortuna — Trip Companion</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">

  <!-- Compact status bar: one line, expands on tap -->
  <header class="status" id="status">
    <button class="status-line" id="statusLine" aria-expanded="false" aria-controls="statusDetail"></button>
    <div class="status-detail" id="statusDetail"></div>
  </header>

  <main>
    <section class="screen on" id="today"  aria-label="Today"></section>
    <section class="screen"    id="plan"   aria-label="Plan"></section>
    <section class="screen"    id="food"   aria-label="Food"></section>
    <section class="screen"    id="pack"   aria-label="Pack"></section>
    <section class="screen"    id="more"   aria-label="More"></section>
  </main>
</div>

<nav class="nav" aria-label="Sections">
  <button class="navbtn" data-tab="today" aria-current="page">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
    Today<span class="navdot" hidden></span>
  </button>
  <button class="navbtn" data-tab="plan">
    <svg viewBox="0 0 24 24"><path d="M9 4 3 6.5v13L9 17l6 2.5 6-2.5v-13L15 6.5 9 4z"/><path d="M9 4v13M15 6.5v13"/></svg>
    Plan
  </button>
  <button class="navbtn" data-tab="food">
    <svg viewBox="0 0 24 24"><path d="M6 3v8a3 3 0 0 0 6 0V3"/><path d="M9 11v10"/><path d="M18 3c-1.5 2-2 4-2 6 0 1.5.7 2.5 2 3v9"/></svg>
    Food
  </button>
  <button class="navbtn" data-tab="pack">
    <svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>
    Pack
  </button>
  <button class="navbtn" data-tab="more">
    <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
    More
  </button>
</nav>

<script src="data.js"></script>
<script src="art.js"></script>
<script src="app.js"></script>
</body>
</html>
